<div class="min-h-[80vh] flex items-center justify-center px-6 bg-white">
  <div class="w-full max-w-md bg-white border-2 border-black p-8 rounded-2xl">
    <div class="mb-8">
      <h2 class="font-display text-3xl uppercase tracking-tighter text-black font-bold mb-2">
        Welcome Back
      </h2>
      <p class="text-sm text-gray-600 font-medium">Log in to manage your Veloce account.</p>
    </div>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="space-y-6" novalidate>
      <div class="space-y-2">
        <label class="block text-xs uppercase tracking-wider font-bold text-black"
          >Username or Email</label
        >
        <input
          type="text"
          name="identifier"
          [(ngModel)]="credentials.identifier"
          required
          class="w-full px-4 py-3 border-2 border-black rounded-xl text-sm font-medium focus:outline-none focus:border-green"
          placeholder="Enter your username or email"
        />
      </div>

      <div class="space-y-2">
        <label class="block text-xs uppercase tracking-wider font-bold text-black">Password</label>
        <input
          type="password"
          name="password"
          [(ngModel)]="credentials.password"
          required
          class="w-full px-4 py-3 border-2 border-black rounded-xl text-sm font-medium focus:outline-none focus:border-green"
          placeholder="••••••••"
        />
        <div class="flex justify-end mt-1">
          <a
            routerLink="/forgot-password"
            class="text-xs font-semibold text-green hover:underline ml-1 cursor-pointer"
            >Forgot Password?</a
          >
        </div>
      </div>

      @if (errorMessage()) {
        <div class="p-3 bg-white border-2 border-red-500 rounded-xl text-xs font-bold text-red-600">
          {{ errorMessage() }}
        </div>
      }

      <button
        type="submit"
        [disabled]="loginForm.invalid || isLoading()"
        class="w-full bg-green text-white py-3 rounded-full font-medium text-sm disabled:bg-gray-100 disabled:text-gray-400 disabled:border-gray-300 disabled:cursor-not-allowed border-2 border-transparent cursor-pointer"
      >
        @if (isLoading()) {
          <span
            class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin inline-block"
          ></span>
        } @else {
          Sign In
        }
      </button>

      <div class="text-center pt-2">
        <p class="text-xs font-medium text-gray-600">
          Don't have an account?
          <a routerLink="/register" class="text-green font-bold hover:underline ml-1 cursor-pointer">Create one</a>
        </p>
      </div>
    </form>
  </div>
</div>
