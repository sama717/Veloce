<div class="min-h-[90vh] flex items-center justify-center px-6 py-12 bg-white">
  <div class="w-full max-w-2xl bg-white border-2 border-black p-8 rounded-2xl">
    
    <div class="mb-8">
      <h2 class="font-display text-3xl uppercase tracking-tighter text-black font-bold mb-2">Create Account</h2>
      <p class="text-sm text-gray-600 font-medium">Join Veloce today. Set up your profile configuration details below.</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-6" novalidate>
      
      <!-- User Mode Selection Toggles (Matches C# Enums) -->
      <div class="space-y-2">
        <label class="block text-xs uppercase tracking-wider font-bold text-black">I want to register as a:</label>
        <div class="grid grid-cols-2 gap-4">
          <button 
            type="button"
            (click)="registerForm.patchValue({ mode: 0 })"
            [class.bg-black]="registerForm.get('mode')?.value === 0"
            [class.text-white]="registerForm.get('mode')?.value === 0"
            class="py-3 border-2 border-black font-bold text-sm rounded-xl transition-all duration-200 cursor-pointer"
          >
            Customer
          </button>
          <button 
            type="button"
            (click)="registerForm.patchValue({ mode: 1 })"
            [class.bg-black]="registerForm.get('mode')?.value === 1"
            [class.text-white]="registerForm.get('mode')?.value === 1"
            class="py-3 border-2 border-black font-bold text-sm rounded-xl transition-all duration-200 cursor-pointer"
          >
            Provider
          </button>
        </div>
      </div>

      <hr class="border-gray-200 my-4" />

      <!-- Name Details Section -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="space-y-2">
          <label class="block text-xs uppercase tracking-wider font-bold text-black">First Name</label>
          <input type="text" formControlName="firstName" class="w-full px-4 py-3 border-2 border-black rounded-xl text-sm font-medium focus:outline-none focus:border-green" placeholder="John" />
        </div>
        <div class="space-y-2">
          <label class="block text-xs uppercase tracking-wider font-bold text-black">Middle Name (Optional)</label>
          <input type="text" formControlName="middleName" class="w-full px-4 py-3 border-2 border-black rounded-xl text-sm font-medium focus:outline-none focus:border-green" placeholder="Edward" />
        </div>
        <div class="space-y-2">
          <label class="block text-xs uppercase tracking-wider font-bold text-black">Last Name</label>
          <input type="text" formControlName="lastName" class="w-full px-4 py-3 border-2 border-black rounded-xl text-sm font-medium focus:outline-none focus:border-green" placeholder="Doe" />
        </div>
      </div>

      <!-- Communications Section -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="space-y-2">
          <label class="block text-xs uppercase tracking-wider font-bold text-black">Email Address</label>
          <input type="email" formControlName="email" class="w-full px-4 py-3 border-2 border-black rounded-xl text-sm font-medium focus:outline-none focus:border-green" placeholder="john@example.com" />
        </div>
        <div class="space-y-2">
          <label class="block text-xs uppercase tracking-wider font-bold text-black">Phone Number</label>
          <input type="text" formControlName="phoneNumber" class="w-full px-4 py-3 border-2 border-black rounded-xl text-sm font-medium focus:outline-none focus:border-green" placeholder="+123456789" />
        </div>
      </div>

      <!-- Account Safety Section -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="space-y-2">
          <label class="block text-xs uppercase tracking-wider font-bold text-black">Username</label>
          <input type="text" formControlName="username" class="w-full px-4 py-3 border-2 border-black rounded-xl text-sm font-medium focus:outline-none focus:border-green" placeholder="johndoe" />
        </div>
        <div class="space-y-2">
          <label class="block text-xs uppercase tracking-wider font-bold text-black">Password</label>
          <input type="password" formControlName="password" class="w-full px-4 py-3 border-2 border-black rounded-xl text-sm font-medium focus:outline-none focus:border-green" placeholder="••••••••" />
        </div>
      </div>

      <!-- Error Boundary Messaging Stream -->
      @if (errorMessage()) {
        <div class="p-3 bg-white border-2 border-red-500 rounded-xl text-xs font-bold text-red-600">
          {{ errorMessage() }}
        </div>
      }

      <!-- Form Submission Control -->
      <button 
        type="submit"
        [disabled]="registerForm.invalid || isLoading()"
        class="w-full bg-black hover:bg-neutral-800 disabled:bg-gray-100 disabled:text-gray-400 disabled:border-gray-300 disabled:cursor-not-allowed text-white py-4 rounded-full font-bold text-sm transition-all duration-300 active:scale-98 flex justify-center items-center gap-2 cursor-pointer border-2 border-transparent"
      >
        @if (isLoading()) {
          <span class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
        } @else {
          Create My Veloce Account
        }
      </button>

      <div class="text-center pt-2">
        <p class="text-xs font-medium text-gray-600">
          Already have an account? 
          <a routerLink="/login" class="text-green font-bold hover:underline ml-1">Sign in here</a>
        </p>
      </div>

    </form>
  </div>
</div>
