<div class="bg-white min-h-screen px-6 py-12 md:px-12 max-w-4xl mx-auto">
  <div class="border-4 border-black rounded-3xl p-8 bg-white shadow-[8px_8px_0px_0px_rgba(0,0,0,1)]">
    
    <h1 class="font-display text-3xl font-bold uppercase tracking-tight text-black mb-2">
      List a Car
    </h1>
    <p class="text-xs font-medium text-gray-500 mb-8 uppercase tracking-wider">
      Add a new vehicle to your fleet
    </p>

    @if (errorMessage()) {
      <div class="p-4 mb-6 border-2 border-red-500 text-red-600 rounded-xl text-xs font-bold bg-white">
        {{ errorMessage() }}
      </div>
    }

    @if (successMessage()) {
      <div class="p-4 mb-6 border-2 border-green-500 text-green-600 rounded-xl text-xs font-bold bg-white">
        {{ successMessage() }}
      </div>
    }

    <form [formGroup]="carForm" (ngSubmit)="onSubmit()" class="space-y-6">
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-[10px] uppercase tracking-wider font-bold text-black">Brand *</label>
          <input
            type="text"
            formControlName="brand"
            class="w-full px-3 py-3 border-2 border-black rounded-xl text-sm font-medium focus:outline-none focus:border-green-500"
          />
        </div>
        <div>
          <label class="block text-[10px] uppercase tracking-wider font-bold text-black">Model *</label>
          <input
            type="text"
            formControlName="model"
            class="w-full px-3 py-3 border-2 border-black rounded-xl text-sm font-medium focus:outline-none focus:border-green-500"
          />
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-[10px] uppercase tracking-wider font-bold text-black">Year *</label>
          <input
            type="number"
            formControlName="year"
            class="w-full px-3 py-3 border-2 border-black rounded-xl text-sm font-medium focus:outline-none focus:border-green-500"
          />
        </div>
        <div>
          <label class="block text-[10px] uppercase tracking-wider font-bold text-black">Color *</label>
          <input
            type="text"
            formControlName="color"
            class="w-full px-3 py-3 border-2 border-black rounded-xl text-sm font-medium focus:outline-none focus:border-green-500"
          />
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-[10px] uppercase tracking-wider font-bold text-black">Mileage (km) *</label>
          <input
            type="number"
            formControlName="mileage"
            class="w-full px-3 py-3 border-2 border-black rounded-xl text-sm font-medium focus:outline-none focus:border-green-500"
          />
        </div>
        <div>
          <label class="block text-[10px] uppercase tracking-wider font-bold text-black">Seats *</label>
          <input
            type="number"
            formControlName="seats"
            class="w-full px-3 py-3 border-2 border-black rounded-xl text-sm font-medium focus:outline-none focus:border-green-500"
          />
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-[10px] uppercase tracking-wider font-bold text-black">Listing Type *</label>
          <select
            formControlName="type"
            class="w-full px-3 py-3 border-2 border-black rounded-xl text-sm font-medium bg-white focus:outline-none focus:border-green-500"
          >
            <option value="Rent">For Rent</option>
            <option value="Sale">For Sale</option>
          </select>
        </div>
        <div>
          <label class="block text-[10px] uppercase tracking-wider font-bold text-black">Condition *</label>
          <select
            formControlName="condition"
            class="w-full px-3 py-3 border-2 border-black rounded-xl text-sm font-medium bg-white focus:outline-none focus:border-green-500"
          >
            <option value="New">New</option>
            <option value="Used">Used</option>
          </select>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        @if (listingType === 'Sale') {
          <div>
            <label class="block text-[10px] uppercase tracking-wider font-bold text-black">Price (Sale) *</label>
            <input
              type="number"
              formControlName="price"
              placeholder="e.g., 50000"
              class="w-full px-3 py-3 border-2 border-black rounded-xl text-sm font-medium focus:outline-none focus:border-green-500"
            />
          </div>
        } @else {
          <div>
            <label class="block text-[10px] uppercase tracking-wider font-bold text-black">Price Per Day (Rent) *</label>
            <input
              type="number"
              formControlName="pricePerDay"
              placeholder="e.g., 200"
              class="w-full px-3 py-3 border-2 border-black rounded-xl text-sm font-medium focus:outline-none focus:border-green-500"
            />
          </div>
        }
        <div>
          <label class="block text-[10px] uppercase tracking-wider font-bold text-black">Quantity *</label>
          <input
            type="number"
            formControlName="quantity"
            class="w-full px-3 py-3 border-2 border-black rounded-xl text-sm font-medium focus:outline-none focus:border-green-500"
          />
        </div>
      </div>

      <div>
        <label class="block text-[10px] uppercase tracking-wider font-bold text-black">Description</label>
        <textarea
          formControlName="description"
          rows="3"
          placeholder="Describe the car condition, features, etc."
          class="w-full px-3 py-3 border-2 border-black rounded-xl text-sm font-medium focus:outline-none focus:border-green-500 resize-none"
        ></textarea>
      </div>

      @if (!isProvider()) {
        <div>
          <label class="block text-[10px] uppercase tracking-wider font-bold text-black">Dealership *</label>
          <select
            formControlName="dealershipId"
            class="w-full px-3 py-3 border-2 border-black rounded-xl text-sm font-medium bg-white focus:outline-none focus:border-green-500"
          >
            <option [value]="0" disabled>Select a dealership</option>
            @for (dealer of dealerships; track dealer.id) {
              <option [value]="dealer.id">{{ dealer.name }}</option>
            }
          </select>
        </div>
      }

      <div>
        <label class="block text-[10px] uppercase tracking-wider font-bold text-black">Images</label>
        <input
          type="file"
          (change)="onFileSelected($event)"
          accept="image/*"
          multiple
          class="w-full px-3 py-3 border-2 border-black rounded-xl text-sm font-medium focus:outline-none file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:bg-black file:text-white file:text-sm file:font-bold hover:file:bg-neutral-800"
        />
        
        @if (previewUrls.length > 0) {
          <div class="flex flex-wrap gap-2 mt-3">
            @for (url of previewUrls; track $index) {
              <div class="relative w-20 h-20 border-2 border-black rounded-xl overflow-hidden">
                <img [src]="url" class="w-full h-full object-cover" />
                <button
                  type="button"
                  (click)="removeFile($index)"
                  class="absolute -top-1 -right-1 bg-red-600 text-white rounded-full w-5 h-5 text-xs font-bold hover:bg-red-700 transition-colors"
                >
                  ×
                </button>
              </div>
            }
          </div>
        }
      </div>

      <div class="flex flex-col sm:flex-row items-center gap-3 pt-4">
        <button
          type="submit"
          [disabled]="isSubmitting()"
          class="w-full sm:w-auto bg-black hover:bg-neutral-800 disabled:bg-neutral-400 text-white font-bold text-sm py-4 px-8 rounded-xl transition-transform active:scale-95 cursor-pointer shadow-[4px_4px_0px_0px_rgba(22,163,74,1)]"
        >
          {{ isSubmitting() ? 'Listing...' : 'List Car' }}
        </button>
        <button
          type="button"
          (click)="router.navigate(['/my-cars'])"
          class="w-full sm:w-auto text-center border-2 border-black hover:bg-gray-50 text-black font-bold text-sm py-4 px-8 rounded-xl transition-colors cursor-pointer"
        >
          Cancel
        </button>
      </div>
    </form>
  </div>
</div>
