<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Veloce</title>
    <style>
        body { margin: 0; padding: 0; background-color: #f5f5f5; font-family: Arial, sans-serif; }
        .wrapper { max-width: 600px; margin: 40px auto; background: #ffffff; border-radius: 8px; overflow: hidden; }
        .header { padding: 32px; text-align: center; border-bottom: 1px solid #eeeeee; }
        .header h1 { margin: 0; font-size: 24px; letter-spacing: 2px; color: #111111; }
        .body { padding: 40px 32px; }
        .body h2 { margin: 0 0 12px; font-size: 20px; color: #111111; }
        .body p { margin: 0 0 24px; font-size: 15px; color: #555555; line-height: 1.6; }
        .code-box { background: #f0f0f0; border-radius: 6px; padding: 16px; text-align: center; font-size: 28px; font-weight: bold; letter-spacing: 6px; color: #111111; margin-bottom: 24px; }
        .footer { padding: 24px 32px; text-align: center; border-top: 1px solid #eeeeee; }
        .footer p { margin: 0; font-size: 12px; color: #aaaaaa; }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="header">
        <h1>VELOCE</h1>
    </div>
    <div class="body">
        <h2>{{Title}}</h2>
        <p>{{Message}}</p>
        <div class="code-box">{{Code}}</div>
        <p style="font-size:13px; color:#aaaaaa;">This code expires in 15 minutes. If you didn't request this, ignore this email.</p>
    </div>
    <div class="footer">
        <p>© 2025 Veloce. All rights reserved.</p>
    </div>
</div>
</body>
</html>
